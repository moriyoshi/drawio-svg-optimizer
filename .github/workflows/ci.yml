name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci # `prepare` builds dist/, which check:browser reads
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:browser

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20 is the floor `engines` promises: the ES2023 array methods the
        # plugins use (`toReversed`, `toSorted`) do not exist before it.
        node: [20, 22, 24]
        # One macOS runner, because it is the only place the CoreText back-end
        # and the Helvetica/Hiragino specs are more than a skip.
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Specs that need system fonts, a native back-end, or the network skip
      # themselves when the runner cannot offer one.
      - run: npm test

  visual:
    name: visual (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-output
          path: test/visual/output/
          if-no-files-found: ignore
